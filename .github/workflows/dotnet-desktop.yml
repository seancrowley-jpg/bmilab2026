name: bmi_lab__week_1_2026                                        # "BMI_CI" workflow, name is optional

env:
  AZURE_WEBAPP_NAME: MyFirstAzureApp20261010135602         # set this to your application's name
  
  AZURE_WEBAPP_PACKAGE_PATH: '.'        # set this to the path to your web app project


on:
 workflow_dispatch:        
 push:                                             #  workflow_dispatch for manually triggered
   branches: [ master ]
 

jobs:
  build:                                            # "build" job
    runs-on: windows-latest                         # runner
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Build for Release
      run: dotnet build --configuration Release

      # Deploy to Azure Web apps
    - name: Run Azure webapp deploy action using publish profile credentials
      uses: azure/webapps-deploy@v2
      with: 
        app-name: ${{ env.AZURE_WEBAPP_NAME }}                        # your app name
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE  }} # Define secret variable in repository settings as per action documentation
        package: 'bmi2021/${{ env.AZURE_WEBAPP_PACKAGE_PATH }}'
