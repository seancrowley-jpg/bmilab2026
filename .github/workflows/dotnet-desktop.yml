name: bmi_lab__week_1_2026                                        # "BMI_CI" workflow, name is optional

env:
  AZURE_WEBAPP_NAME:            # set this to your application's name
  
  AZURE_WEBAPP_PACKAGE_PATH: 'publish/myapp'        # set this to the path to your web app project


on:
 workflow_dispatch:        
 push:                                             #  workflow_dispatch for manually triggered
   branches: [ master ]
 

jobs:
  build:                                            # "build" job
    runs-on: windows-latest                         # runner
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Build for Release
      run: dotnet build --configuration Release
